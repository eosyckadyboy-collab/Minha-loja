<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Minha Loja de Arte</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:#f5f5f5;
      color:#111;
    }
    header{
      background:#111;
      color:#fff;
      padding:22px;
      text-align:center;
    }
    main{
      max-width:1000px;
      margin:25px auto;
      padding:15px;
    }
    .box{
      background:#fff;
      padding:22px;
      border-radius:16px;
      margin-bottom:20px;
      box-shadow:0 5px 20px #0001;
    }
    input,button{
      width:100%;
      padding:13px;
      margin-top:10px;
      border-radius:10px;
      border:1px solid #ddd;
      font-size:16px;
    }
    button{
      border:0;
      background:#111;
      color:white;
      cursor:pointer;
      font-weight:bold;
    }
    .aprovar{background:#159447}
    .rejeitar{background:#d33}
    .apagar{background:#555}
    .stats{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:15px;
    }
    .stat{
      background:#111;
      color:white;
      padding:20px;
      border-radius:14px;
      text-align:center;
    }
    .stat strong{
      display:block;
      font-size:28px;
    }
    .produto{
      border:1px solid #ddd;
      border-radius:14px;
      padding:15px;
      margin-top:15px;
    }
    .produto img{
      width:100%;
      max-height:250px;
      object-fit:cover;
      border-radius:10px;
    }
    .produto h3{margin-bottom:5px}
    .acoes{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }
    .acoes button:last-child{
      background:#d33;
    }
    .hidden{display:none}
    .logout{
      background:#d33;
      max-width:180px;
    }
    @media(max-width:600px){
      .stats{grid-template-columns:1fr}
      .acoes{grid-template-columns:1fr}
    }
  </style>
</head>

<body>

<header>
  <h1>🎨 Administração</h1>
  <p>Minha Loja de Arte — Siedade Arte</p>
</header>

<main>

  <section id="loginBox" class="box">
    <h2>🔐 Acesso administrativo</h2>
    <p>Digite o PIN de administrador.</p>

    <input
      type="password"
      id="pin"
      placeholder="PIN"
      inputmode="numeric"
    >

    <button onclick="entrarAdmin()">Entrar</button>

    <p id="erro" style="color:#d33;"></p>
  </section>

  <section id="painel" class="hidden">

    <div class="box">
      <h2>📊 Painel</h2>

      <div class="stats">
        <div class="stat">
          <strong id="pendentes">0</strong>
          Pendentes
        </div>

        <div class="stat">
          <strong id="aprovadas">0</strong>
          Aprovadas
        </div>

        <div class="stat">
          <strong id="total">0</strong>
          Total
        </div>
      </div>

      <button class="logout" onclick="sairAdmin()">Sair</button>
    </div>

    <div class="box">
      <h2>⏳ Obras aguardando aprovação</h2>
      <div id="listaPendentes"></div>
    </div>

    <div class="box">
      <h2>✅ Obras publicadas</h2>
      <div id="listaAprovadas"></div>
    </div>

  </section>

</main>

<script src="admin.js"></script>

</body>
</html>
